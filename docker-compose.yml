services:
  api:
    build: ./api
    container_name: api
    expose:
      - "8080"
    environment:
      - PROFILE_ACTIVE=${PROFILE_ACTIVE}
      - WEB_URL=${WEB_URL}
      - API_URL=${API_URL}
      - POSTGRES_HOST=database
      - SB_DB_NAME=${SB_DB_NAME}
      - SB_DB_USER=${SB_DB_USER}
      - SB_DB_PASSWORD=${SB_DB_PASSWORD}
      - MAILER_FROM=${MAILER_FROM}
      - MAILER_HOST=${MAILER_HOST}
      - MAILER_PORT=${MAILER_PORT}
      - MAILER_USERNAME=${MAILER_USERNAME}
      - MAILER_PASSWORD=${MAILER_PASSWORD}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_BLOG_WEB_CLIENT_ID=${KEYCLOAK_BLOG_WEB_CLIENT_ID}
      - KEYCLOAK_BLOG_API_CLIENT_ID=${KEYCLOAK_BLOG_API_CLIENT_ID}
      - KEYCLOAK_BLOG_API_CLIENT_SECRET=${KEYCLOAK_BLOG_API_CLIENT_SECRET}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
    depends_on:
      - database
    networks:
      - local-network

  web:
    build:
      context: ./web
      args:
        - WEB_URL=${WEB_URL}
        - API_URL=${API_URL}
        - API_URL_SERVER=${API_URL_SERVER}
        - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
        - NEXTAUTH_URL=${NEXTAUTH_URL}
        - KEYCLOAK_URL=${KEYCLOAK_URL}
        - KEYCLOAK_REALM=${KEYCLOAK_REALM}
        - KEYCLOAK_BLOG_WEB_CLIENT_ID=${KEYCLOAK_BLOG_WEB_CLIENT_ID}
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - NEXT_PUBLIC_WEB_URL=${WEB_URL}
      - NEXT_PUBLIC_API_URL=${API_URL}
      - NEXT_PUBLIC_API_URL_SERVER=${API_URL_SERVER}
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - AUTH_SECRET=${AUTH_SECRET}
      - KEYCLOAK_BLOG_WEB_CLIENT_ID=${KEYCLOAK_BLOG_WEB_CLIENT_ID}
      - KEYCLOAK_BLOG_WEB_CLIENT_SECRET=${KEYCLOAK_BLOG_WEB_CLIENT_SECRET}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    container_name: web
    expose:
      - "3000"
    networks:
      - local-network

  database:
    image: postgres:17-alpine
    container_name: database
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # API Spring Boot
      - SB_DB_NAME=${SB_DB_NAME}
      - SB_DB_USER=${SB_DB_USER}
      - SB_DB_PASSWORD=${SB_DB_PASSWORD}
      # Keycloak
      - KC_DB_NAME=${KC_DB_NAME}
      - KC_DB_USERNAME=${KC_DB_USERNAME}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KEYCLOAK_SMTP_FROM=${KEYCLOAK_SMTP_FROM}
      - KEYCLOAK_BLOG_API_SECRET=${KEYCLOAK_BLOG_API_SECRET}
      - KEYCLOAK_GOOGLE_CLIENT_SECRET=${KEYCLOAK_GOOGLE_CLIENT_SECRET}
      - KEYCLOAK_GITHUB_CLIENT_SECRET=${KEYCLOAK_GITHUB_CLIENT_SECRET}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    command: start --import-realm
    environment:
      - DOMAIN=${DOMAIN}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://database:5432/${KC_DB_NAME}
      - KC_DB_USERNAME=${KC_DB_USERNAME}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KC_HOSTNAME=${KEYCLOAK_URL}
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_FRONTEND_URL=${KEYCLOAK_FRONTEND_URL}
      - KC_SMTP_DOMAIN=${KEYCLOAK_SMTP_DOMAIN}
      - KC_SMTP_FROM_DISPLAY_NAME=${KEYCLOAK_SMTP_FROM_DISPLAY_NAME}
      - KC_SMTP_FROM=${KEYCLOAK_SMTP_FROM}
      - KC_SMTP_HOST=${KEYCLOAK_SMTP_HOST}
      - KC_SMTP_USERNAME=${KEYCLOAK_SMTP_USERNAME}
      - KC_SMTP_PORT=${KEYCLOAK_SMTP_PORT}
      - KC_SMTP_PASSWORD=${KEYCLOAK_SMTP_PASSWORD}
      - KC_BLOG_API_SECRET=${KEYCLOAK_BLOG_API_SECRET}
      - KC_GOOGLE_CLIENT_ID=${KEYCLOAK_GOOGLE_CLIENT_ID}
      - KC_GOOGLE_CLIENT_SECRET=${KEYCLOAK_GOOGLE_CLIENT_SECRET}
      - KC_GITHUB_CLIENT_ID=${KEYCLOAK_GITHUB_CLIENT_ID}
      - KC_GITHUB_CLIENT_SECRET=${KEYCLOAK_GITHUB_CLIENT_SECRET}
    expose:
      - "8080"
    depends_on:
      - database
    volumes:
      - ./keycloak/import/blog-realm-realm.json:/opt/keycloak/data/import/blog-realm-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - local-network

networks:
  local-network:
    driver: bridge

volumes:
  pgdata:
